# 方法论 brownfield-adopter overlay 源：brownfield-baseline（S33）
# ─────────────────────────────────────────────────────────────────────────────
# 本文件记录 baseline-seed 显式可选全库扫描的命令语义。与 gui-ui-first.yaml 不同，
# 【baseline-seed 不是 launched flow 的 builtin gate、也不由 flow 引擎驱动】：
#   - bootstrap: adopted 且恢复门通过时，required / 安全 partial / seeded 三态的
#     默认入口都由 next 指向 `openlogos change <slug>`；seed 状态仅作旁路机器信息。
#   - 只有用户或宿主显式选择 eager seed 时，AI 会话/driver 才经
#     `openlogos baseline-seed`（begin/commit/status，见 spec/logos-project.md）落盘。
#   - 因此本 overlay【不注入 launched.yaml 的 node 序列】；它只记录可选命令入口，
#     不改 proposal_step 状态机，也不新增 gate、marker 或人工确认。
#
# baseline-seed 节点语义（非 builtin gate，explicit command-driven）：
overlay: []   # 有意为空：不改写 builtin flow node 序列
baseline_seed_node:
  id: baseline-seed
  name: 可选逆向建立现状种子
  skill: brownfield-adopter
  driven_by: command            # 仅显式 openlogos baseline-seed；非默认 next、非 flow gate
  producer: ai-session-or-driver
  states: [required, partial, seeded]   # 仅描述 eager seed 子系统状态
  default_entry:
    required: "openlogos change <slug>"
    partial:  "openlogos change <slug>"
    seeded:   "openlogos change <slug>"
  optional_entry:
    required: "openlogos baseline-seed begin --module <id> --manifest <path>  # 显式预扫后派发 producer 写 staging → commit"
    partial:  "openlogos baseline-seed commit --module <id> --run-id <id>     # 显式续提交；或重新 begin"
    seeded:   "openlogos baseline-seed begin --module <id> --manifest <path>  # 显式重扫（可选）"
  invariants:
    - "adopt 只写兼容初值 required、不启动 AI、不产逆向内容、不声称基线已建立"
    - "required、仅 open run/未提交 staging 的安全 partial、seeded 均不阻断 change，也不劫持默认 action/next_node"
    - "状态与目标文件唯一写入者是 CLI（baseline-seed）；producer 只写 run 私有 staging"
    - "seeded 当且仅当必需 kind 齐 + 全部 expected 合法 + 完整新集合在盘（经 commit journal 事务）"
    - "prepared/committing journal 不是成功分支；机器读取入口先在锁内恢复，失败硬报 baseline_commit_in_progress 且不读取 resources/index/coverage"
