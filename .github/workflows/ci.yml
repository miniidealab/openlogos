name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # Windows 回归集（架构 §五十二 52.7）：真实 Windows Node / NTFS / Git Bash，只跑 test:windows 登记的
  # 回归文件——全量套件含大量依赖 POSIX 路径与 shell 的既有用例，不纳入本 job。
  windows-regression:
    name: Windows regression
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - name: Run Windows regression set
        run: npm run test:windows
